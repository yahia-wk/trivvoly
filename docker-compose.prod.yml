# One Trivvoly site on the server (production or staging): the app from the image the release
# pipeline published, its own database, and nightly backups. deploy/deploy.sh runs it as
#   docker compose -p trivvoly-<site> --env-file env/common.env --env-file env/<site>.env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
# HTTPS for both sites is one shared Caddy (deploy/caddy.yml). See docs/DEPLOY.md.
services:
  app:
    # Exactly the image built and scanned for this commit; nothing is built on the server
    image: ghcr.io/yahia-wk/trivvoly:${TRIVVOLY_TAG:?deploy.sh sets TRIVVOLY_TAG}
    build: !reset null
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in env/<site>.env}
      TRUST_PROXY: "1"

  backup:
    # Once a day: a compressed copy of this site's database, keeping the last 14
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: trivvoly
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env/<site>.env}
      PGDATABASE: trivvoly
    volumes: ["${BACKUP_DIR:?Set BACKUP_DIR in env/<site>.env}:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/trivvoly-$$(date -u +%Y-%m-%d-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$f.part"; then mv "$$f.part" "$$f"; echo "backup: $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          ls -1t /backups/trivvoly-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      app:
        condition: service_healthy  # so the first backup has the tables in it
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
