# Online: HTTPS in front of the app, and nightly database backups. Used with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (deploy/deploy.sh does this). Needs DOMAIN and ACME_EMAIL in .env. See docs/DEPLOY.md.
services:
  app:
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2.11.7-alpine
    # On the server's own network, not Docker's: Docker relays IPv6 connections itself, which would
    # hide every IPv6 visitor's address (most phones on mobile data) behind one internal address.
    # This way Caddy sees real addresses, and the firewall (ufw) controls ports 80 and 443 directly.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (Let's Encrypt writes here if a certificate has trouble)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep them, or Let's Encrypt limits kick in
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  backup:
    # Once a day: a compressed copy of the database in ./backups, keeping the last 14
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: trivvoly
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: trivvoly
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/trivvoly-$$(date -u +%Y-%m-%d-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$f.part"; then mv "$$f.part" "$$f"; echo "backup: $$f"; else rm -f "$$f.part"; echo "backup FAILED"; fi
          ls -1t /backups/trivvoly-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      app:
        condition: service_healthy  # so the first backup has the tables in it
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  caddy_data:
  caddy_config:
