# Trivvoly with a Postgres database: `docker compose up --build`, then open http://localhost:3000.
# First copy .env.example to .env and set POSTGRES_PASSWORD (compose won't start without it).
# For a real server, put HTTPS in front of it and fill in the rest of .env. See docs/HOSTING.md.
services:
  app:
    build: .
    ports: ["${PORT:-3000}:3000"]
    environment:
      DATABASE_URL: postgresql+psycopg://trivvoly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/trivvoly
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: &logs   # Docker keeps logs forever by default; cap them at 5 files of 10 MB
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trivvoly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trivvoly
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trivvoly"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *logs

volumes:
  pgdata:
