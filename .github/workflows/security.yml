# Every day: are any of our dependencies, or the published image, now known to be vulnerable?
# A failure emails you (GitHub notifies about failed scheduled runs). Code itself is scanned by
# CodeQL (codeql.yml), and Dependabot opens pull requests for updates (dependabot.yml).
name: Security

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily
  workflow_dispatch:
  pull_request:
    paths: ["frontend/package*.json", "backend/pyproject.toml", "Dockerfile", ".github/workflows/security.yml"]

permissions:
  contents: read

jobs:
  npm:
    name: npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (every package, including the dev tools you run on your PC)
        working-directory: frontend
        run: npm audit

  python:
    name: Python packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: List exactly what the server installs
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install --quiet "./backend[postgres]"
          /tmp/app/bin/pip freeze --exclude-editable | grep -v '^trivvoly' > /tmp/requirements.txt
          cat /tmp/requirements.txt
      - name: pip-audit
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip --strict

  image:
    name: Published image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy scan of ghcr.io/yahia-wk/trivvoly:main (fixable high or critical problems fail)
        run: |
          if ! docker pull --quiet ghcr.io/yahia-wk/trivvoly:main; then
            echo "No published image yet (it appears after the first release)."; exit 0
          fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress ghcr.io/yahia-wk/trivvoly:main
