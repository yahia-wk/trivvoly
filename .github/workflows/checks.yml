# Tests, on every push to a branch and every pull request. Pushes to main run them as the
# first step of the release (release.yml), so they aren't run twice there.
# Branch protection on main requires these to pass before anything is merged.
name: Checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.workflow == 'Checks' }}

jobs:
  backend:
    name: Backend tests (Postgres)
    # Pull requests from this repository already ran on push; this runs them for forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trivvoly
          POSTGRES_PASSWORD: trivvoly
          POSTGRES_DB: trivvoly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trivvoly" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./backend[dev,postgres]"
      - name: Tests on SQLite
        working-directory: backend
        run: python -m pytest
      - name: Tests on Postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trivvoly:trivvoly@localhost:5432/trivvoly
        run: python -m pytest

  frontend:
    name: Frontend type-check, tests and build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ../backend
      - run: npm ci --no-audit --no-fund
      - name: Generated types match the backend
        run: |
          npm run gen:types
          git diff --exit-code -- src/lib/contract.gen.ts || { echo "::error::Run 'npm run gen:types' in frontend/ and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Docker image builds
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
