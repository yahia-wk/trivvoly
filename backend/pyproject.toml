[project]
name = "trivvoly"
version = "0.2.0"
description = "Live trivia night for a TV and everyone's phones: the game server."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "websockets==17.2",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.3",
    "regex==2026.9.29",
    "httpx==0.28.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]==3.3.6",
]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trivvoly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
